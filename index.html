<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TaskFlow</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%2339ff88' d='M12 0c.8 7 5 11.2 12 12-7 .8-11.2 5-12 12-.8-7-5-11.2-12-12C7 11.2 11.2 7 12 0z'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&family=Exo+2:wght@800&display=swap" rel="stylesheet">
<style>
:root{--bg:#060a08;--s:#0e1612;--s2:#15211a;--bd:#1f3328;--g:#39ff88;--g2:#0e7a42;--t:#e8f4ec;--m:#82988c;--r:#ff6b6b;--y:#ffd166}
*{box-sizing:border-box;margin:0}body{font-family:Cairo,Tajawal,sans-serif;background:radial-gradient(900px 500px at 90% -10%,#0d3a22,transparent 60%),var(--bg);color:var(--t);min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}:focus-visible{outline:2px solid var(--g);outline-offset:2px}
#sp{position:fixed;inset:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;z-index:99;transition:opacity .5s}
#lg{direction:ltr;font-size:clamp(40px,12vw,72px);font-weight:800;letter-spacing:2px}#lg span{display:inline-block;opacity:0;animation:in .6s forwards;text-shadow:0 0 24px var(--g);color:var(--g)}
@keyframes in{from{opacity:0;transform:translateY(10px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
.bar{width:min(260px,70vw);height:4px;background:#12281c;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--g);box-shadow:0 0 12px var(--g);animation:ld 1.6s .3s ease-out forwards}@keyframes ld{to{width:100%}}
#sp small{direction:ltr;color:var(--m)}#lg svg{width:.7em;height:.7em;fill:var(--g);filter:drop-shadow(0 0 10px var(--g))}
.lgo{direction:ltr;display:inline-flex;align-items:center;gap:8px;font-family:'Exo 2',Cairo,sans-serif;font-weight:800}.lgo b{color:var(--g)}.lgo i{font-style:normal;color:#fff}.lgo svg{width:.8em;height:.8em;fill:var(--g);filter:drop-shadow(0 0 6px #39ff88aa)}.mh{display:none}
@media(max-width:760px){.mh{display:block;font-size:28px;margin-bottom:14px}}
#app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}#app[hidden]{display:none}
nav{position:sticky;top:0;height:100vh;padding:18px 12px;border-inline-end:1px solid var(--bd);background:#09100c;display:flex;flex-direction:column;gap:4px}
nav h1{direction:ltr;font-size:24px;padding:4px 10px 14px}
nav a{display:flex;gap:10px;padding:9px 12px;border-radius:12px;color:var(--m);text-decoration:none;font-size:15px}nav a.on{background:var(--s2);color:var(--g);box-shadow:inset 0 0 0 1px var(--g2)}
main{padding:24px;max-width:1000px;width:100%;margin:auto;padding-bottom:90px}
h2{font-size:22px;margin-bottom:14px}h3{font-size:16px;margin-bottom:8px}
.c{background:linear-gradient(160deg,var(--s2),var(--s));border:1px solid var(--bd);border-radius:18px;padding:16px;box-shadow:0 8px 24px #0006}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin-bottom:14px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.sp{justify-content:space-between}
.b{border:1px solid var(--bd);background:var(--s2);padding:8px 14px;border-radius:12px;cursor:pointer}.b:hover{border-color:var(--g2)}.b.p{background:var(--g);color:#032010;font-weight:800;border:0;box-shadow:0 0 16px #39ff8855}
.ib{background:0;border:0;cursor:pointer;color:var(--m);padding:6px;border-radius:8px}.ib:hover{color:var(--g)}
input,select,textarea{background:#0a110d;border:1px solid var(--bd);border-radius:10px;padding:8px 10px;width:100%}label{display:block;font-size:13px;color:var(--m);margin-bottom:10px}
.big{font-size:40px;font-weight:800;color:var(--g);text-shadow:0 0 16px #39ff8844}.m{color:var(--m);font-size:13px}.pb{height:8px;background:#12281c;border-radius:9px;overflow:hidden;margin:8px 0}.pb i{display:block;height:100%;background:linear-gradient(90deg,var(--g2),var(--g));border-radius:9px;transition:width .4s}
.tk{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #16241c}.tk .gr{flex:1;min-width:0}.tk small{display:flex;gap:6px;flex-wrap:wrap;color:var(--m);font-size:12px}.tk small i{font-style:normal;background:#0a110d;padding:1px 8px;border-radius:9px}
.ck{width:26px;height:26px;border-radius:50%;border:2px solid var(--g2);background:0;color:#032010;cursor:pointer;flex:none;font-weight:800}.dn .ck{background:var(--g);box-shadow:0 0 10px var(--g)}.dn b{text-decoration:line-through;opacity:.5}.lt b{color:var(--r)}
.em{color:var(--m);text-align:center;padding:22px}.chip{padding:4px 12px;border-radius:99px;border:1px solid var(--bd);background:0;cursor:pointer;color:var(--m)}.chip.on{color:var(--g);border-color:var(--g)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cd{min-height:78px;background:var(--s);border:1px solid var(--bd);border-radius:10px;padding:4px;cursor:pointer;overflow:hidden;font-size:12px}.cd.sel{border-color:var(--g)}.cd.now span{color:var(--g);font-weight:800}.cd.out{opacity:.35}
.cd em{display:block;font-style:normal;background:#12281c;border-radius:6px;padding:0 5px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11px}em.dn{opacity:.45;text-decoration:line-through}em.lt{background:#3a1717}
.ch{display:flex;flex-direction:column;gap:8px;max-height:52vh;overflow:auto;margin-bottom:10px}.bu{max-width:85%;padding:9px 13px;border-radius:14px;background:var(--s2);white-space:pre-wrap}.bu.user{align-self:flex-start;background:var(--g2)}.bu.err{background:#3a1717;align-self:center}
.ring{width:210px;height:210px;border-radius:50%;display:grid;place-items:center;margin:14px auto}.ring div{width:170px;height:170px;border-radius:50%;background:var(--s);display:grid;place-items:center;font-size:42px;font-weight:800;direction:ltr}
.bs{display:flex;gap:8px;align-items:flex-end;height:130px}.bs>div{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:2px}.bs i{width:100%;background:linear-gradient(0deg,var(--g2),var(--g));border-radius:6px 6px 0 0}.bs small,.bs b{font-size:11px;color:var(--m)}
#fl{position:fixed;bottom:16px;inset-inline-start:50%;transform:translateX(50%);background:#0b1a12;border:1px solid var(--g);border-radius:99px;padding:8px 16px;box-shadow:0 0 22px #39ff8844;z-index:20;display:flex;gap:12px;align-items:center;direction:ltr}#fl[hidden]{display:none}
#md{position:fixed;inset:0;background:#000b;display:grid;place-items:center;z-index:50;padding:12px}#md[hidden]{display:none}.bx{background:var(--s);border:1px solid var(--bd);border-radius:18px;padding:18px;width:min(440px,100%);max-height:90vh;overflow:auto}
#ts{position:fixed;top:14px;inset-inline:0;display:flex;flex-direction:column;align-items:center;gap:6px;z-index:80;pointer-events:none}#ts span{background:var(--s2);border:1px solid var(--g2);padding:8px 16px;border-radius:12px}
.fab{position:fixed;bottom:24px;inset-inline-end:18px;z-index:15;width:54px;height:54px;border-radius:50%;font-size:26px}
@media(max-width:760px){#app{grid-template-columns:1fr}nav{position:fixed;top:auto;bottom:0;inset-inline:0;height:auto;flex-direction:row;overflow-x:auto;padding:6px;z-index:30;border-top:1px solid var(--bd)}nav h1{display:none}nav a{flex-direction:column;align-items:center;font-size:11px;gap:0;white-space:nowrap}main{padding:14px 12px 150px}.cd{min-height:54px}.cd em{font-size:9px}#fl{bottom:74px}.fab{bottom:130px}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition:none!important}}
</style></head><body>
<div id="sp"><div id="lg" aria-label="TaskFlow"></div><div class="bar"><i></i></div><small>Preparing your workspace...</small></div>
<div id="app" hidden><nav id="nv"></nav><main id="mn" tabindex="-1"></main></div>
<div id="fl" hidden></div><button class="b p fab" aria-label="مهمة جديدة" onclick="tf()">+</button><div id="md" hidden></div><div id="ts" role="status"></div>
<script>
const $=s=>document.querySelector(s),K='taskflow.v1',uid=()=>Math.random().toString(36).slice(2,9),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iso=d=>d.toLocaleDateString('sv'),TD=()=>iso(new Date()),add=(s,n)=>{const d=new Date(s+'T12:00');d.setDate(d.getDate()+n);return iso(d)},nx=(s,r)=>{if(r=='d')return add(s,1);if(r=='w')return add(s,7);const d=new Date(s+'T12:00');d.setMonth(d.getMonth()+1);return iso(d)};
const PR={low:'منخفضة',mid:'متوسطة',high:'عالية'},ST={new:'لم تبدأ',doing:'قيد التنفيذ',done:'مكتملة'},RP={'':'بدون تكرار',d:'يوميًا',w:'أسبوعيًا',m:'شهريًا'},PN=['الفجر','الظهر','العصر','المغرب','العشاء'];
const NAV=[['home','الرئيسية','🏠'],['tasks','مهامي','✅'],['ai','المنظّم الذكي','✨'],['cal','التقويم','📅'],['habits','العادات','🔁'],['pray','الصلوات','🕌'],['timer','المؤقت','⏱'],['goals','أهدافي','🎯'],['notes','الملاحظات','📝'],['stats','الإحصائيات','📊'],['set','الإعدادات','⚙️']];
const STAR='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 0c.8 7 5 11.2 12 12-7 .8-11.2 5-12 12-.8-7-5-11.2-12-12C7 11.2 11.2 7 12 0z"/></svg>',LOGO=`<span class="lgo" aria-label="TaskFlow"><b>Task</b><i>Flow</i>${STAR}</span>`;const D0={tasks:[],habits:[],prayers:{},goals:[],notes:[],sessions:[],chat:[],set:{name:'',week:6,focus:25,short:5,long:15,notif:false,api:'',wake:'07:00',sleep:'23:00',gkey:'',gmodel:'gemini-2.5-flash',verse:true,profile:''}};
let db;try{db={...D0,...JSON.parse(localStorage[K]||'{}')};db.set={...D0.set,...db.set}}catch{db=structuredClone(D0)}
const save=()=>{try{db.chat=db.chat.slice(-40);localStorage[K]=JSON.stringify(db)}catch{toast('تعذر الحفظ: مساحة التخزين ممتلئة')}};
function toast(m){const e=document.createElement('span');e.textContent=m;$('#ts').append(e);setTimeout(()=>e.remove(),3800)}
function ping(m){toast(m);if(db.set.notif&&window.Notification&&Notification.permission=='granted')new Notification('TaskFlow',{body:m})}
let cur=location.hash.slice(1)||'home',F={q:'',pri:'',st:'',sort:'time'},C={v:'month',d:TD()},pd=TD(),plan=null,busy=0,dg=null,nq='';
const T=id=>db.tasks.find(x=>x.id==id),late=t=>t.st!='done'&&t.date&&t.date<TD(),mins=t=>{const[h,m]=t.time.split(':');return h*60+ +m};
const pct=d=>{const a=db.tasks.filter(t=>t.date==d);return a.length?Math.round(a.filter(t=>t.st=='done').length/a.length*100):0};
function conf(t){if(!t.time||!t.date)return[];const a=mins(t),b=a+(+t.dur||30);return db.tasks.filter(x=>x.id!=t.id&&x.date==t.date&&x.time&&x.st!='done'&&mins(x)<b&&mins(x)+(+x.dur||30)>a)}
/* ---- نموذج عام ---- */
function form(title,fs,ok){$('#md').innerHTML=`<div class="bx" role="dialog" aria-label="${esc(title)}"><h3>${esc(title)}</h3><form id="fm">${fs.map(f=>`<label>${f.l}${f.o?`<select name="${f.k}">${f.o.map(([v,t])=>`<option value="${esc(v)}" ${v==f.v?'selected':''}>${esc(t)}</option>`).join('')}</select>`:f.x?`<textarea name="${f.k}" rows="3">${esc(f.v)}</textarea>`:`<input name="${f.k}" type="${f.t||'text'}" value="${esc(f.v)}" ${f.r?'required':''} ${f.t=='number'?'min="1" max="720"':''}>`}</label>`).join('')}<div class="row"><button class="b p">حفظ</button><button type="button" class="b" onclick="cm()">إلغاء</button></div></form></div>`;$('#md').hidden=false;$('#fm').onsubmit=e=>{e.preventDefault();ok(Object.fromEntries(new FormData(e.target)));cm()};$('#fm input,#fm select').focus()}
const cm=()=>{$('#md').hidden=true},go=v=>{location.hash=v};document.addEventListener('keydown',e=>e.key=='Escape'&&cm());
/* ---- المهام ---- */
function tf(id,pre={}){const t=id?T(id):{pri:'mid',st:'new',rep:'',date:TD(),dur:30,...pre};form(id?'تعديل مهمة':'مهمة جديدة',[{k:'t',l:'اسم المهمة',v:t.t,r:1},{k:'desc',l:'وصف',v:t.desc,x:1},{k:'date',l:'التاريخ',t:'date',v:t.date},{k:'time',l:'الوقت',t:'time',v:t.time},{k:'dur',l:'المدة (دقيقة)',t:'number',v:t.dur},{k:'pri',l:'الأولوية',o:Object.entries(PR),v:t.pri},{k:'cat',l:'التصنيف',v:t.cat},{k:'st',l:'الحالة',o:Object.entries(ST),v:t.st},{k:'rep',l:'التكرار',o:Object.entries(RP),v:t.rep},{k:'dl',l:'الموعد النهائي',t:'date',v:t.dl},{k:'goal',l:'الهدف المرتبط',o:[['','بدون'],...db.goals.map(g=>[g.id,g.n])],v:t.goal},{k:'note',l:'ملاحظات',v:t.note,x:1}],o=>{o.t=o.t.trim();if(!o.t)return;let x=id?T(id):{id:uid()};Object.assign(x,o,{dur:+o.dur||30});if(!id)db.tasks.push(x);save();const c=conf(x);if(c.length)ping('تنبيه: تعارض مع «'+c[0].t+'»');render()})}
function tg(id){const t=T(id);if(t.st=='done'){t.st='new'}else{t.st='done';t.doneAt=Date.now();if(t.rep&&t.date&&!db.tasks.some(x=>x.src==t.id&&x.date==nx(t.date,t.rep)))db.tasks.push({...t,id:uid(),src:t.id,st:'new',date:nx(t.date,t.rep),doneAt:0})}save();render()}
function tx(id){if(confirm('حذف المهمة؟')){db.tasks=db.tasks.filter(t=>t.id!=id);save();render()}}
const row=t=>`<div class="tk ${t.st=='done'?'dn':''} ${late(t)?'lt':''}"><button class="ck" aria-label="تعليم كمكتملة" onclick="tg('${t.id}')">${t.st=='done'?'✓':''}</button><div class="gr"><b>${esc(t.t)}</b><small>${[t.date,t.time,t.dur&&t.dur+' د',PR[t.pri],ST[t.st],t.cat,t.rep&&RP[t.rep],t.dl&&'نهائي '+t.dl,late(t)&&'متأخرة'].filter(Boolean).map(x=>`<i>${esc(x)}</i>`).join('')}</small></div><button class="ib" aria-label="تعديل" onclick="tf('${t.id}')">✎</button><button class="ib" aria-label="حذف" onclick="tx('${t.id}')">🗑</button></div>`;
function tl(){const w={high:0,mid:1,low:2};let a=db.tasks.filter(t=>(!F.q||(t.t+(t.desc||'')+(t.cat||'')).includes(F.q))&&(!F.pri||t.pri==F.pri)&&(!F.st||t.st==F.st));a.sort((x,y)=>F.sort=='pri'?w[x.pri]-w[y.pri]:((x.date||'9')+(x.time||'')).localeCompare((y.date||'9')+(y.time||'')));return a.length?a.map(row).join(''):'<div class="em">لا توجد مهام مطابقة. أضف مهمة جديدة من الزر أعلاه.</div>'}
const sel=(k,o)=>`<select aria-label="${k}" onchange="F.${k}=this.value;$('#tl').innerHTML=tl()">${o.map(([v,t])=>`<option value="${v}" ${F[k]==v?'selected':''}>${t}</option>`).join('')}</select>`;
/* ---- الصفحات ---- */
const V={};
V.home=()=>{const n=new Date(),h=n.getHours(),a=db.tasks.filter(t=>t.date==TD()),d=a.filter(t=>t.st=='done').length,p=pct(TD()),up=db.tasks.filter(t=>t.st!='done'&&t.date>=TD()).sort((x,y)=>(x.date+(x.time||'')).localeCompare(y.date+(y.time||''))).slice(0,5);
return`<div class="c row sp" style="margin-bottom:14px"><div><h2 style="margin:0">${h<12?'صباح الخير':'مساء الخير'}${db.set.name?'، '+esc(db.set.name):''}</h2><div class="m">${n.toLocaleDateString('ar-EG',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</div></div><div class="big" id="clk" style="direction:ltr"></div></div>
${(()=>{const nw=a.filter(t=>t.st!='done').sort((x,y)=>(x.time||'99').localeCompare(y.time||'99'))[0]||up[0];return`<div class="c" style="margin-bottom:14px;border-color:var(--g2)"><h3>إيه اللي دلوقتي؟</h3>${nw?`<b>${esc(nw.t)}</b><div class="m">${nw.date||''} ${nw.time||''}</div><div class="row" style="margin-top:10px"><button class="b p" onclick="nowGo('${nw.id}')">ابدأ تركيز</button><button class="b" onclick="tg('${nw.id}')">خلّصتها</button></div>`:'<div class="m">مفيش مهام معلّقة. خد راحة تستحقها.</div>'}</div>`})()}<div class="g2"><div class="c"><h3>إنجاز اليوم</h3><div class="big">${p}%</div><div class="pb"><i style="width:${p}%"></i></div><div class="m">مكتملة ${d} · متبقية ${a.length-d}</div><div class="row" style="margin-top:12px"><button class="b p" onclick="tf()">+ مهمة سريعة</button><button class="b" onclick="go('ai')">✨ المساعد الذكي</button></div></div>
<div class="c"><h3>العادات اليوم</h3>${db.habits.length?db.habits.map(h=>`<div class="tk ${h.log[TD()]?'dn':''}"><button class="ck" aria-label="${esc(h.n)}" onclick="hg('${h.id}','${TD()}')">${h.log[TD()]?'✓':''}</button><b>${esc(h.n)}</b></div>`).join(''):'<div class="em">لا توجد عادات بعد.</div>'}</div></div>
<div class="g2"><div class="c"><h3>المهام القادمة</h3>${up.length?up.map(row).join(''):'<div class="em">لا مهام قادمة.</div>'}</div>
<div class="c"><h3>الأهداف</h3>${db.goals.length?db.goals.slice(0,4).map(g=>`<div>${esc(g.n)} <span class="m">${gp(g)}%</span><div class="pb"><i style="width:${gp(g)}%"></i></div></div>`).join(''):'<div class="em">لم تضف أهدافًا بعد.</div>'}</div></div>`};
V.tasks=()=>`<div class="row sp"><h2>مهامي</h2><button class="b p" onclick="tf()">+ مهمة</button></div><div class="row" style="margin-bottom:10px"><input style="flex:1;min-width:140px" placeholder="بحث..." aria-label="بحث" value="${esc(F.q)}" oninput="F.q=this.value;$('#tl').innerHTML=tl()">${sel('pri',[['','كل الأولويات'],...Object.entries(PR)])}${sel('st',[['','كل الحالات'],...Object.entries(ST)])}${sel('sort',[['time','حسب الوقت'],['pri','حسب الأولوية']])}</div><div class="c" id="tl">${tl()}</div>`;
/* التقويم */
const ws=d=>{const x=new Date(d+'T12:00');x.setDate(x.getDate()-((x.getDay()-db.set.week+7)%7));return iso(x)};
function mv(d){const t=T(dg);if(t){t.date=d;save();const c=conf(t);if(c.length)ping('تعارض مع «'+c[0].t+'»');render()}}
const chip=t=>`<em draggable="true" ondragstart="dg='${t.id}'" class="${t.st=='done'?'dn':late(t)?'lt':''}">${esc(t.t)}</em>`;
const cell=(d,out)=>{const a=db.tasks.filter(t=>t.date==d);return`<div class="cd ${d==C.d?'sel':''} ${d==TD()?'now':''} ${out?'out':''}" onclick="C.d='${d}';render()" ondragover="event.preventDefault()" ondrop="mv('${d}')"><span>${+d.slice(8)}</span>${a.slice(0,C.v=='week'?20:2).map(chip).join('')}${a.length>2&&C.v!='week'?`<em>+${a.length-2}</em>`:''}</div>`};

async function callAI(msgs,cx){const st=r=>{if(!r.ok)throw new Error(r.status==429?'تم تجاوز حد الاستخدام. حاول بعد قليل.':r.status==404?'الرابط أو اسم الموديل غير صحيح.':r.status==400||r.status==403?'المفتاح مرفوض أو غير صالح. راجعه في الإعدادات.':r.status==500?'الـ Worker غير مُعدّ (AI_API_KEY).':r.status==502?'مزوّد الذكاء الاصطناعي رفض الطلب.':'تعذر الحصول على رد (رمز '+r.status+').')};
if(db.set.gkey){const i=msgs.findIndex(m=>m.role=='user');msgs=msgs.slice(Math.max(0,i));const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(db.set.gmodel||'gemini-2.5-flash')+':generateContent',{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':db.set.gkey},body:JSON.stringify({systemInstruction:{parts:[{text:SYS+'\nContext: '+JSON.stringify(cx).slice(0,12000)}]},contents:msgs.map(m=>({role:m.role=='assistant'?'model':'user',parts:[{text:String(m.content).slice(0,3000)}]})),generationConfig:{responseMimeType:'application/json'}}),signal:AbortSignal.timeout(60000)});st(r);const d=await r.json();const c=(d.candidates?.[0]?.content?.parts||[]).map(p=>p.text||'').join('')||'{}';try{return JSON.parse(c)}catch{return{reply:c,plan:null}}}
const r=await fetch(db.set.api,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:msgs,ctx:cx}),signal:AbortSignal.timeout(60000)});st(r);return r.json()}
async function send(txt){txt=(txt||'').trim();if(!txt||busy)return;if(!db.set.api&&!db.set.gkey){db.chat.push({r:'err',c:'لم يتم إعداد اتصال الذكاء الاصطناعي. أضف مفتاح Gemini من الإعدادات.'});return render()}
db.chat.push({r:'user',c:txt});busy=1;render();
try{if(!navigator.onLine)throw new Error('لا يوجد اتصال بالإنترنت.');const j=await callAI(db.chat.filter(m=>m.r!='err').slice(-12).map(m=>({role:m.r,content:m.c})),ctx());db.chat.push({r:'assistant',c:String(j.reply||'').slice(0,4000)||'(لا يوجد رد)'});plan=vp(j.plan)}
catch(e){db.chat.push({r:'err',c:e.name=='TypeError'?'تعذر الوصول إلى الخادم. تأكد من رابط الـ Worker ومن إعداد CORS.':e.name=='TimeoutError'?'انتهت مهلة الاتصال.':e.message})}
busy=0;save();render();$('#ci')?.focus();$('#chs')?.scrollTo(0,1e6)}
const pe=(k,i,f,v)=>{plan[k][i][f]=v;render()};
function ok(){let n=0;plan.tasks.filter(t=>t.on).forEach(t=>{delete t.on;db.tasks.push(t);n++});plan.habits.filter(h=>h.on).forEach(h=>{db.habits.push({id:uid(),n:h.n,d:h.d,tm:'',log:{}});n++});plan.goals.filter(g=>g.on).forEach(g=>{db.goals.push({id:uid(),n:g.n,d:g.d,start:TD(),target:g.target,pri:'mid',steps:g.steps.map(t=>({t,done:false}))});n++});plan.changes.filter(c=>c.on).forEach(c=>{const t=T(c.id);if(t){if(c.date)t.date=c.date;if(c.time)t.time=c.time;n++}});plan=null;save();toast('تم اعتماد '+n+' عنصر');go('cal')}
const pv=()=>{if(!plan)return'';const ck=(k,i)=>`<input type="checkbox" style="width:auto" aria-label="تضمين" ${plan[k][i].on?'checked':''} onchange="plan['${k}'][${i}].on=this.checked">`;return`<div class="c" style="margin-bottom:12px"><h3>معاينة الخطة (لم تُحفظ بعد)</h3>${plan.tasks.map((t,i)=>{const c=conf(t).length+plan.tasks.filter((x,j)=>j!=i&&x.on&&t.on&&x.date==t.date&&x.time&&t.time&&Math.abs(mins(x)-mins(t))<(+t.dur||30)).length;return`<div class="row" style="margin-bottom:6px">${ck('tasks',i)}<input style="flex:2;min-width:130px" value="${esc(t.t)}" aria-label="العنوان" onchange="pe('tasks',${i},'t',this.value)"><input type="date" style="flex:1" value="${t.date}" aria-label="التاريخ" onchange="pe('tasks',${i},'date',this.value)"><input type="time" style="flex:1" value="${t.time}" aria-label="الوقت" onchange="pe('tasks',${i},'time',this.value)"><span class="m">${t.dur}د ${c?'⚠️ تعارض':''}</span></div>`}).join('')}${plan.habits.map((h,i)=>`<div class="row" style="margin-bottom:6px">${ck('habits',i)}<b>عادة:</b> ${esc(h.n)}</div>`).join('')}${plan.goals.map((g,i)=>`<div class="row" style="margin-bottom:6px">${ck('goals',i)}<b>هدف:</b> ${esc(g.n)} (${g.steps.length} خطوة)</div>`).join('')}${plan.changes.map((c,i)=>`<div class="row" style="margin-bottom:6px">${ck('changes',i)}<b>تعديل:</b> ${esc(T(c.id).t)} ← ${c.date||T(c.id).date} ${c.time||''}</div>`).join('')}<div class="row"><button class="b p" onclick="ok()">اعتماد الخطة</button><button class="b" onclick="plan=null;render()">تجاهل</button></div></div>`};
V.ai=()=>`<h2>المنظّم الذكي</h2>${db.set.api||db.set.gkey?'':'<div class="c" style="border-color:var(--y);margin-bottom:12px">الذكاء الاصطناعي غير مُعدّ بعد. أضف مفتاح Gemini من <a href="#set" style="color:var(--g)">الإعدادات</a>.</div>'}<details class="c" style="margin-bottom:12px" ${db.set.profile?'':'open'}><summary>ملف حياتي (يقرأه المساعد في كل رسالة)</summary><textarea id="pf" rows="6" style="margin-top:8px" placeholder="اكتب شغلك ومواعيد حصصك ويوم إجازتك ومواد دراستك ووقتك الفاضي. لا تكتب أسرارًا مالية أو شخصية، لأن النص يُرسل للمزوّد مع كل رسالة.">${esc(db.set.profile)}</textarea><button class="b" style="margin-top:8px" onclick="sv('profile',$('#pf').value.slice(0,3000));toast('تم حفظ ملف حياتك')">حفظ</button></details><div class="ch" id="chs">${db.chat.length?db.chat.map(m=>`<div class="bu ${m.r=='user'?'user':m.r=='err'?'err':''}">${esc(m.c)}</div>`).join(''):'<div class="em">احكِ لي عن التزاماتك وأهدافك، مثل: «عندي مدرسة من 8 إلى 2 وامتحانات بعد أسبوعين، وأريد المذاكرة والتمرن».</div>'}${busy?'<div class="bu">يفكر...</div>':''}</div>${pv()}<div class="row" style="margin-bottom:8px">${[['لم أنتهِ من مهام اليوم','لم أستطع إنهاء مهام اليوم. أعد توزيع المتبقي على الأوقات المناسبة دون المساس بالالتزامات الثابتة.'],['ظرف طارئ غدًا','عندي ظرف طارئ غدًا. اقترح تعديل الخطة مع توضيح التغييرات.'],['خطة أسبوعية','ساعدني في بناء خطة أسبوعية، واسألني عما تحتاجه.']].map(([l,q])=>`<button class="chip" onclick="send('${q}')">${l}</button>`).join('')}</div><form class="row" onsubmit="event.preventDefault();const i=$('#ci');const v=i.value;i.value='';send(v)"><input id="ci" style="flex:1" placeholder="اكتب رسالتك..." aria-label="رسالتك" autocomplete="off"><button class="b p" ${busy?'disabled':''}>إرسال</button><button type="button" class="b" onclick="db.chat=[];plan=null;save();render()">مسح المحادثة</button></form><p class="m">لا يُرسل المساعد سوى عناوين المهام القادمة وأسماء العادات والأهداف. لا يعدّل شيئًا دون اعتمادك.</p>`;
/* الإعدادات */
function exp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({...db,set:{...db.set,gkey:''}})],{type:'application/json'}));a.download='taskflow-backup-'+TD()+'.json';a.click()}
function imp(f){const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(o.merge&&Array.isArray(o.tasks)){const ids=new Set(db.tasks.map(t=>t.id)),n=o.tasks.filter(t=>t&&t.id&&t.t&&!ids.has(t.id));db.tasks.push(...n);save();render();return toast('تمت إضافة '+n.length+' مهمة')}if(!Array.isArray(o.tasks)||!Array.isArray(o.habits))throw 0;if(confirm('استبدال بياناتك الحالية بالنسخة الاحتياطية؟')){const k=db.set.gkey;db={...D0,...o};db.set={...D0.set,...db.set,gkey:k};save();render();toast('تم الاستيراد')}}catch{toast('الملف غير صالح')}};r.readAsText(f)}
function sv(k,v){db.set[k]=v;save()}
V.set=()=>`<h2>الإعدادات</h2><div class="c"><label>الاسم<input value="${esc(db.set.name)}" onchange="sv('name',this.value.slice(0,40))"></label><div class="row"><label style="flex:1">وقت الاستيقاظ<input type="time" value="${db.set.wake}" onchange="sv('wake',this.value||'07:00')"></label><label style="flex:1">وقت النوم<input type="time" value="${db.set.sleep}" onchange="sv('sleep',this.value||'23:00')"></label></div><label>بداية الأسبوع<select onchange="sv('week',+this.value)">${[[6,'السبت'],[0,'الأحد'],[1,'الاثنين']].map(([v,t])=>`<option value="${v}" ${db.set.week==v?'selected':''}>${t}</option>`).join('')}</select></label><div class="row">${[['focus','تركيز'],['short','راحة قصيرة'],['long','راحة طويلة']].map(([k,t])=>`<label style="flex:1">${t} (د)<input type="number" min="1" max="180" value="${db.set[k]}" onchange="sv('${k}',Math.min(180,Math.max(1,+this.value||25)));if(!tm.run){tm.left=dur(tm.m)}"></label>`).join('')}</div><label><span class="row"><input type="checkbox" style="width:auto" ${db.set.notif?'checked':''} onchange="nt(this)"> تفعيل التذكيرات وإشعارات المتصفح</span></label><label>مفتاح Gemini (يُحفظ على جهازك فقط ولا يدخل النسخة الاحتياطية)<input dir="ltr" type="password" placeholder="AIza..." value="${esc(db.set.gkey)}" onchange="sv('gkey',this.value.trim())"></label><label>موديل Gemini<input dir="ltr" value="${esc(db.set.gmodel)}" onchange="sv('gmodel',this.value.trim()||'gemini-2.5-flash')"></label><label>رابط الـ Worker (بديل اختياري، يُستخدم لو لم تضف مفتاحًا)<input dir="ltr" placeholder="https://taskflow-ai.xxx.workers.dev/api/chat" value="${esc(db.set.api)}" onchange="sv('api',this.value.trim())"></label><label><span class="row"><input type="checkbox" style="width:auto" ${db.set.verse?'checked':''} onchange="sv('verse',this.checked)"> عرض آية قرآنية قبل بدء جلسة التركيز</span></label><div class="row" style="margin-bottom:12px"><button class="b" onclick="testAI()">اختبار اتصال الذكاء الاصطناعي</button></div><p class="m">الوضع الداكن هو الوضع الأساسي للتطبيق.</p><div class="row"><button class="b" onclick="exp()">تصدير نسخة احتياطية</button><label class="b" style="margin:0;cursor:pointer">استيراد<input type="file" accept=".json" hidden onchange="imp(this.files[0])"></label><button class="b" style="color:var(--r)" onclick="if(confirm('سيتم مسح كل بياناتك نهائيًا. هل أنت متأكد؟')){db=structuredClone(D0);save();render();toast('تم مسح البيانات')}">مسح كل البيانات</button></div></div>`;
async function testAI(){if(!db.set.api&&!db.set.gkey)return toast('أضف مفتاح Gemini أولًا');toast('جارٍ الاختبار...');try{await callAI([{role:'user',content:'قل مرحبا فقط'}],{});toast('✅ الاتصال شغال')}catch(e){toast('❌ '+(e.name=='TypeError'?'تعذر الوصول للخادم. تحقق من الإنترنت أو الرابط.':e.message))}}
async function nt(el){if(el.checked&&window.Notification&&Notification.permission=='default')await Notification.requestPermission();sv('notif',el.checked);if(el.checked&&window.Notification&&Notification.permission!='granted')toast('إشعارات المتصفح غير مسموحة؛ ستظهر التذكيرات داخل التطبيق فقط.')}
/* الرسم والتنقل */
function render(){if(!V[cur])cur='home';$('#nv').innerHTML='<h1>'+LOGO+'</h1>'+NAV.map(([k,t,i])=>`<a href="#${k}" class="${k==cur?'on':''}" ${k==cur?'aria-current="page"':''}><span aria-hidden="true">${i}</span>${t}</a>`).join('');$('#mn').innerHTML='<div class="mh">'+LOGO+'</div>'+V[cur]();tick()}
onhashchange=()=>{cur=location.hash.slice(1)||'home';render();scrollTo(0,0)};
function tick(){const n=new Date();if(tm.run){tm.left=tm.end-Date.now();if(tm.left<=0)return tfin()}const c=$('#clk');if(c)c.textContent=n.toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'});const t=$('#tt');if(t){t.textContent=fmt(tm.left);$('#tr').style.background=`conic-gradient(var(--g) ${Math.round((1-tm.left/dur(tm.m))*100)}%,#12281c 0)`}
const f=$('#fl'),sh=cur!='timer'&&(tm.run||tm.left<dur(tm.m));f.hidden=!sh;if(sh)f.innerHTML=`<b>${fmt(tm.left)}</b><button class="ib" aria-label="${tm.run?'إيقاف':'استكمال'}" onclick="${tm.run?'tpause()':'tstart()'}">${tm.run?'⏸':'▶'}</button><button class="ib" onclick="go('timer')" aria-label="فتح المؤقت">⏱</button>`}
setInterval(tick,500);
const seen=new Set();function remind(){if(!db.set.notif)return;const n=new Date(),nm=n.getHours()*60+n.getMinutes();db.tasks.forEach(t=>{if(t.st!='done'&&t.date==TD()&&t.time){const d=mins(t)-nm;if(d>=0&&d<=10&&!seen.has(t.id)){seen.add(t.id);ping(`بعد ${d} دقيقة: ${t.t}`)}}});db.habits.forEach(h=>{if(h.tm&&!h.log[TD()]&&h.tm==n.toTimeString().slice(0,5)&&!seen.has(h.id+TD())){seen.add(h.id+TD());ping('تذكير بالعادة: '+h.n)}});const l=db.tasks.filter(late).length;if(l&&!seen.has('late')){seen.add('late');ping(`لديك ${l} مهمة متأخرة`)}}
setInterval(remind,30000);setTimeout(remind,4000);
/* البداية */
$('#lg').innerHTML='TaskFlow'.split('').map((c,i)=>`<span style="animation-delay:${i*90}ms;${i>3?'color:#fff':''}">${c}</span>`).join('')+`<span style="animation-delay:800ms">${STAR}</span>`;
setTimeout(()=>{$('#sp').style.opacity=0;$('#app').hidden=false;render();setTimeout(()=>$('#sp').remove(),500)},1900);
